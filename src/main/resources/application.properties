quarkus.http.port=${MUSIC_LIBRARY_PORT:8795}
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${music-library.db.path:data/music-library.sqlite}?foreign_keys=on
quarkus.datasource.jdbc.max-size=4

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.log.min-level=TRACE
quarkus.log.level=INFO
quarkus.log.category."org.kroky.musiclib".min-level=TRACE
quarkus.log.category."org.kroky.musiclib".level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.enabled=true
quarkus.log.file.level=INFO
quarkus.log.file.path=data/logs/music-library-ng.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Optional external config:
# java -Dquarkus.config.locations=file:/path/to/music-library.properties -jar target/quarkus-app/quarkus-run.jar
music-library.db.path=data/music-library.sqlite
music-library.backup.directory=data/backups
music-library.scan.default-status=CHECKED

music-library.root-detection.candidates[0]=/e/Google Drive/Music/_vyber
