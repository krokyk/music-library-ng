# Set the base output name for packaged artifacts and the native executable.
quarkus.package.output-name=music-library-ng

# Keep the packaged jar/native executable from getting Quarkus' default "-runner" suffix.
quarkus.package.jar.add-runner-suffix=false

# Enable ANSI color output when the host console supports it.
quarkus.console.color=true

# Serve the backend and packaged frontend on the shared app port.
quarkus.http.port=8795

# Bind all interfaces so Windows browsers can reach WSL-hosted dev runs.
quarkus.http.host=0.0.0.0

# Use SQLite for local single-user storage.
quarkus.datasource.db-kind=sqlite

# Resolve the SQLite file path from music-library.db.path and enable foreign keys plus a 10 second busy timeout.
quarkus.datasource.jdbc.url=jdbc:sqlite:${music-library.db.path:data/music-library-ng.sqlite}?foreign_keys=on&busy_timeout=10000

# Keep the JDBC pool small because SQLite has one writer and short write windows matter.
quarkus.datasource.jdbc.max-size=4

# Do not run Flyway before the music root is validated; MusicRootService runs migration after root resolution.
quarkus.flyway.migrate-at-start=false

# Allow Flyway to baseline an existing database when needed during development.
quarkus.flyway.baseline-on-migrate=true

# Compile with TRACE available so category levels can be raised at runtime.
quarkus.log.min-level=TRACE

# Use INFO as the default runtime log level.
quarkus.log.level=INFO

# Keep TRACE available for application package categories.
quarkus.log.category."org.kroky.musiclib".min-level=TRACE

# Log normal application activity at INFO unless overridden locally.
quarkus.log.category."org.kroky.musiclib".level=INFO

# Write logs to the console where the app is launched.
quarkus.log.console.enabled=true
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Write rotating application logs under data so logs stay with runtime state.
quarkus.log.file.enabled=true
quarkus.log.file.level=INFO
quarkus.log.file.path=data/logs/music-library-ng.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Quarkus automatically loads ./config/application.properties from the process working directory.
# Use -Dquarkus.config.locations=file:/path/to/music-library.properties when overrides live elsewhere.
# For a native executable, use music-library-ng.exe -Dquarkus.config.locations=file:./application.properties when config sits next to the executable.

# Store the SQLite database under data so runtime state stays local to the app directory.
music-library.db.path=data/music-library-ng.sqlite

# Store generated database backups under data.
music-library.backup.directory=data/backups

# Store generated reports under data.
music-library.report.directory=data/reports

# Format full release dates in details and tooltips.
music-library.release.date.display.format=yyyy-MM-dd

# MusicBrainz API base URL used for JSON web-service requests.
music-library.providers.musicbrainz.base-url=https://musicbrainz.org/ws/2

# MusicBrainz website base URL used when building user-facing links.
music-library.providers.musicbrainz.site-url=https://musicbrainz.org

# Required private MusicBrainz User-Agent belongs in ignored ./config/application.properties and must match music-library-ng (<email>).
# music-library.providers.musicbrainz.user-agent=music-library-ng (<email>)

# Serialize MusicBrainz requests with at least this many milliseconds between calls.
music-library.providers.musicbrainz.request-min-interval-ms=1100

# Limit how many MusicBrainz artist candidates are returned for manual review.
music-library.providers.musicbrainz.search-candidate-limit=5

# Fetch MusicBrainz release groups in pages of this size.
music-library.providers.musicbrainz.release-group-page-size=100

# Use this as a JVM -D or ignored local config entry when auto-detection does not fit the machine.
# music-library.music-root=<music-root>

# Auto-detection candidates are checked in order when music-library.music-root is not supplied.
music-library.root-detection.candidates[0]=E:/Google Drive/Music/_vyber
music-library.root-detection.candidates[1]=G:/My Drive/Music/_vyber

# All marker playlists must exist directly under a candidate root for that root to be accepted.
music-library.root-detection.markers[0]=EPIC.m3u8
music-library.root-detection.markers[1]=MELODEATH.m3u8
music-library.root-detection.markers[2]=POWER METAL.m3u8

# UI defaults seed DB-backed runtime settings until the user changes Settings.
music-library.ui.default-status-complete-visible-ms=10000
music-library.ui.default-scan-poll-interval-ms=200
music-library.ui.default-collection-scan-spinner-enabled=true
music-library.ui.default-artist-scan-spinner-enabled=true
music-library.ui.default-collection-scan-progress-enabled=true
music-library.ui.default-status-history-date-format=yyyy-MM-dd HH:mm:ss.SSS
music-library.ui.default-status-bar-location=top

# Action labels become visible when each pane reaches the configured CSS-pixel width.
music-library.ui.default-action-label-thresholds.collections=400
music-library.ui.default-action-label-thresholds.artists=500
music-library.ui.default-action-label-thresholds.albums=400
music-library.ui.default-action-label-thresholds.titles=600

# Threshold min/max/step values constrain Settings controls and remain property-only.
music-library.ui.action-label-threshold-min.collections=300
music-library.ui.action-label-threshold-min.artists=400
music-library.ui.action-label-threshold-min.albums=300
music-library.ui.action-label-threshold-min.titles=500
music-library.ui.action-label-threshold-max=2000
music-library.ui.action-label-threshold-step=50

# Data columns never shrink below this CSS-pixel width; action columns use control-specific minimums.
music-library.ui.table-grid-column-min-width=60

# First-run Collections workspace column widths seed DB preferences for resizable panes.
music-library.ui.default-workspace-column-widths.artist.name=280
music-library.ui.default-workspace-column-widths.album.name=360
music-library.ui.default-workspace-column-widths.album.release-date=145
music-library.ui.default-workspace-column-widths.album.checked=120
music-library.ui.default-workspace-column-widths.album.collections=180
music-library.ui.default-workspace-column-widths.album.action=122
music-library.ui.default-workspace-column-widths.title.title=460
music-library.ui.default-workspace-column-widths.title.artist=220
music-library.ui.default-workspace-column-widths.title.release-date=145
music-library.ui.default-workspace-column-widths.title.action=178

# First-run Artists screen column widths seed artists-screen.artists-pane.* DB preferences.
music-library.ui.default-artists-screen-column-widths.name=250
music-library.ui.default-artists-screen-column-widths.country=76
music-library.ui.default-artists-screen-column-widths.type=80
music-library.ui.default-artists-screen-column-widths.status=84
music-library.ui.default-artists-screen-column-widths.albums=68
music-library.ui.default-artists-screen-column-widths.unchecked=86
music-library.ui.default-artists-screen-column-widths.local=64
music-library.ui.default-artists-screen-column-widths.provider=180
music-library.ui.default-artists-screen-column-widths.action=104
